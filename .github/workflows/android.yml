name: Android APK

# Builds the installable Android app from dist/. Every run uploads the APK as a workflow artifact;
# pushing a tag such as v1.5.0 also attaches it to the GitHub Release for that tag.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android shell tooling
        run: npm ci

      - name: Test the web app
        run: npm test && npm run check

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Copy dist/ into the Android project
        run: npx cap sync android

      - name: Prepare the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KINETIC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinetic.jks"
            echo "KINETIC_KEYSTORE_FILE=$RUNNER_TEMP/kinetic.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KINETIC_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key. It installs, but it cannot update an install from another build. See android/README.md."
          fi

      - name: Build the APK
        working-directory: android
        env:
          KINETIC_KEYSTORE_PASSWORD: ${{ secrets.KINETIC_KEYSTORE_PASSWORD }}
          KINETIC_KEY_ALIAS: ${{ secrets.KINETIC_KEY_ALIAS }}
          KINETIC_KEY_PASSWORD: ${{ secrets.KINETIC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Kinetic-${version}.apk"
          echo "APK=out/Kinetic-${version}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-apk
          path: ${{ env.APK }}

      - name: Attach the APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$APK" --title "Kinetic ${GITHUB_REF_NAME#v}" --generate-notes
          fi
