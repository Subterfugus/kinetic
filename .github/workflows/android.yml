name: Android APK

# Builds the installable Android app from dist/. Every run uploads the APK as a workflow artifact.
# A push to main whose package.json version has no GitHub Release yet publishes that release
# (tag v<version>) with the APK attached, so releasing is just bumping the version and merging.
# Pushing a tag such as v1.5.0 by hand still works and attaches the APK to that tag's release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Two quick merges to main must not both try to create the same release.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android shell tooling
        run: npm ci

      - name: Test the web app
        run: npm test && npm run check

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Decide whether this run publishes a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          elif [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "Release v${version} already exists; this build is not published."
            else
              echo "No release for v${version} yet; this build publishes it."
              echo "RELEASE_TAG=v${version}" >> "$GITHUB_ENV"
            fi
          fi

      - name: Copy dist/ into the Android project
        run: npx cap sync android

      - name: Prepare the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KINETIC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kinetic.jks"
            echo "KINETIC_KEYSTORE_FILE=$RUNNER_TEMP/kinetic.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No KINETIC_KEYSTORE_BASE64 secret, so this APK is signed with a throwaway key. It installs, but it cannot update an install from another build. See android/README.md."
          fi

      - name: Build the APK
        working-directory: android
        env:
          KINETIC_KEYSTORE_PASSWORD: ${{ secrets.KINETIC_KEYSTORE_PASSWORD }}
          KINETIC_KEY_ALIAS: ${{ secrets.KINETIC_KEY_ALIAS }}
          KINETIC_KEY_PASSWORD: ${{ secrets.KINETIC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          version=$(node -p "require('./package.json').version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/Kinetic-${version}.apk"
          echo "APK=out/Kinetic-${version}.apk" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: kinetic-apk
          path: ${{ env.APK }}

      - name: Publish the APK on the GitHub Release
        if: env.RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # Kinetic.apk is the same file under a fixed name, so the README's download button
        # (releases/latest/download/Kinetic.apk) always points at the newest release.
        run: |
          cp "$APK" out/Kinetic.apk
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" out/Kinetic.apk --clobber
          else
            gh release create "$RELEASE_TAG" "$APK" out/Kinetic.apk --target "$GITHUB_SHA" --title "Kinetic ${RELEASE_TAG#v}" --generate-notes
          fi
